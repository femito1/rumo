<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- RUMO mark: the ring from the "o" of the wordmark (extracted from
       reference/workbook/"Apresentacao Institucional Rumo Gestao de Negocios .pptx",
       ppt/media/image3.png). Replaces the recolored Vite glyph that shipped as a
       placeholder — recoloring that one would only have produced an orange Vite logo. -->
  <title>RUMO</title>
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f99d1c"/>
      <stop offset="0.55" stop-color="#f15a22"/>
      <stop offset="1" stop-color="#dd5928"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#414042"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="url(#r)" stroke-width="11"/>
  <path d="M32 11 L48 27 L38 27 L32 21 Z" fill="#f99d1c"/>
</svg>
